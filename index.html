<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مخبوزات الصفوة الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d523c;
            --accent-color: #e05a2b;
            --bg-light: #fafcfb;
            --healthy-color: #7A4A21;
            --fasting-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f5;
            color: #333;
            padding-bottom: 30px;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            border-bottom: 4px solid var(--accent-color);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .brand-sub {
            color: #fca311;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto 15px auto;
        }

        .category-btn {
            border-radius: 20px;
            margin: 3px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .category-btn.active {
            background-color: var(--accent-color) !important;
            color: white !important;
            border-color: var(--accent-color) !important;
        }

        .fasting-filter-btn {
            border-radius: 20px;
            margin: 3px;
            font-weight: bold;
            background-color: #e8f8f0;
            color: var(--fasting-color);
            border: 2px solid var(--fasting-color);
        }

        .fasting-filter-btn.active {
            background-color: var(--fasting-color) !important;
            color: white !important;
        }

        .menu-card {
            background-color: var(--bg-light);
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }

        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .menu-card.healthy-border {
            border-color: var(--healthy-color);
        }

        .badge-healthy {
            background-color: var(--healthy-color);
            color: #fff;
        }

        .badge-primary-custom {
            background-color: var(--primary-color);
            color: #fff;
        }

        .badge-fasting {
            background-color: var(--fasting-color);
            color: #fff;
            font-size: 0.75rem;
        }

        .badge-diabetic {
            background-color: #0284c7;
            color: #fff;
            font-size: 0.75rem;
        }

        .price-box {
            background-color: #fff1eb;
            border: 1.5px solid var(--accent-color);
            border-radius: 8px;
            padding: 4px 8px;
        }

        .price-num {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-color);
        }

        .price-sub {
            font-size: 0.8rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .ingredients-text {
            font-size: 0.75rem;
            color: #555;
            background-color: #f0f4f2;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 6px;
            text-align: right;
        }

        .allergens-text {
            font-size: 0.7rem;
            color: #d32f2f;
            margin-top: 4px;
            text-align: right;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header text-center">

        <h1 class="fw-bold mb-1"><i class="fa-solid fa-wheat-awn me-2"></i>مخبوزات الصفوة</h1>
        <div class="brand-sub">ALSAFWA BAKERY</div>
    </div>
</div>

<div class="container">
    <!-- البحث والفلترة -->

        <div class="col-md-9 text-center">
            <div class="input-group search-box mb-3">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="ابحث عن صنف أو مكونات...">
            </div>
            
            <div class="d-flex flex-wrap justify-content-center gap-1 mb-2">

            </div>

            <div id="categoryButtons" class="d-flex flex-wrap justify-content-center">

                <button class="btn btn-outline-success category-btn" onclick="filterCategory('الناعم والحلويات')">الناعم والحلويات</button>
                <button class="btn btn-outline-success category-btn" onclick="filterCategory('الفينو والمخبوزات')">الفينو والمخبوزات</button>
                <button class="btn btn-outline-success category-btn" onclick="filterCategory('البقسماط والتوست')">البقسماط والتوست</button>
                <button class="btn btn-outline-success category-btn" onclick="filterCategory('البسكويت والكوكيز')">البسكويت والكوكيز</button>
                <button class="btn btn-outline-success category-btn" onclick="filterCategory('حبة كاملة وشوفان')">🌾 حبة كاملة وشوفان</button>
            </div>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="row g-3" id="menuGrid"></div>
</div>

let currentCategory = 'all';
let isFastingOnly = false;

function renderMenu(items) {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';

    if(items.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted my-5"><h5>لا توجد نتائج مطابقة للبحث أو الفلتر المحدد</h5></div>';
        return;
    }

    items.forEach(item => {
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3';
        
        const cardClass = item.healthy ? 'menu-card healthy-border' : 'menu-card';
        const badgeClass = item.healthy ? 'badge-healthy' : 'badge-primary-custom';
        const tagText = item.healthy ? 'حبة كاملة / شوفان' : 'الصفوة';
        
        const fastingBadge = item.fasting ? '<span class="badge badge-fasting me-1">🌱 صيامي</span>' : '';
        const diabeticBadge = item.diabeticFriendly ? '<span class="badge badge-diabetic me-1">💙 مناسب للسكر</span>' : '';

        col.innerHTML = `
            <div class="${cardClass} p-3 text-center d-flex flex-column justify-content-between">
                <div>
                    <div class="mb-2 d-flex justify-content-center flex-wrap gap-1">
                        <span class="badge ${badgeClass}">${tagText}</span>
                        ${fastingBadge}
                        ${diabeticBadge}
                    </div>
                    <h6 class="fw-bold text-dark mb-1">${item.name}</h6>
                    <div class="ingredients-text">
                        <strong>المكونات:</strong> ${item.ingredients}
                    </div>
                    <div class="allergens-text">
                        ⚠️ <strong>حساسية:</strong> ${item.allergens}
                    </div>
                </div>
                <div class="mt-2">
                    <div class="price-box d-flex justify-content-center align-items-center gap-2">
                        <span class="text-danger fw-bold fs-7">${item.label}</span>
                        <span class="price-num">${item.price}</span>
                    </div>
                    <small class="price-sub mt-1 d-block">${item.sub}</small>
                </div>
            </div>
        `;
        grid.appendChild(col);
    });
}

function filterCategory(cat) {
    currentCategory = cat;
    
    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    applyFilters();
}

function toggleFastingFilter() {
    isFastingOnly = !isFastingOnly;
    const btn = document.getElementById('fastingToggle');
    if(isFastingOnly) {
        btn.classList.add('active');
    } else {
        btn.classList.remove('active');
    }
    applyFilters();
}

function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    
    let filtered = menuData.filter(item => {
        const matchesCategory = (currentCategory === 'all') || (item.category === currentCategory);
        const matchesSearch = item.name.toLowerCase().includes(searchTerm) || item.ingredients.toLowerCase().includes(searchTerm);
        const matchesFasting = isFastingOnly ? item.fasting === true : true;

        return matchesCategory && matchesSearch && matchesFasting;
    });

    renderMenu(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);

// العرض الأولي
renderMenu(menuData);
</script>
